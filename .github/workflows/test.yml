name: Test

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.x'
          cache: true

      - name: Verify formatting
        shell: pwsh
        run: |
          $files = gofmt -l .
          if ($files) {
            $files
            exit 1
          }

      - name: Run tests
        run: go test ./...

      - name: Run vet
        run: go vet ./...
